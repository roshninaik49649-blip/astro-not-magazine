# ASSET REGISTER — every image/figure/font that appears in the magazine.
# RULE: nothing is embedded without a licence entry here. A credit line alone is
# NOT permission. Commercial print rights must be assessed before artwork lock.

assets:
  - path: assets/logo/PLACEHOLDER_LOGO.svg
    kind: logo-placeholder
    source: original, generated by production team
    licence: project-internal (placeholder)
    status: "BLOCKER — official ASTRO-NOT logo file + brand approval required before artwork lock"
  - path: figures/out/*.svg
    kind: figures
    source: original, generated by figures/make_figures.py (seeded RNG, reproducible)
    licence: project-internal (original work)
    status: cleared; simulated datasets carry visible SIMULATED banners + units + uncertainties
  - path: assets/illustrations/*.svg
    kind: illustrations
    source: original hand-written SVG, production team
    licence: project-internal (original work)
    status: cleared
  - path: assets/illustrations/cover-cosmos.svg
    kind: cover-key-image
    source: original (Earth-and-cosmos key image: Earth limb, starfield, galaxy)
    licence: project-internal (original work — used instead of unlicensed photos)
    status: cleared; replaces photographic placeholder pending licence review
  - path: assets/illustrations/op-telescope.svg, op-blackhole.svg, op-beyondearth.svg, op-ai.svg, op-detective.svg
    kind: chapter-opener-artwork
    source: original (telescope & starlight rays / accretion ring / lunar lander with Earth
            and Mars / data-node network / magnifier over case file AN-2050-017)
    licence: project-internal (original work)
    status: cleared
  - path: assets/illustrations/back-cosmos.svg
    kind: closing-visual
    source: original (Earth night limb with human lights, stars, orbital arcs)
    licence: project-internal (original work)
    status: cleared; fulfils the p48 "original visual" credit line
  - path: font: Noto Sans (system-installed)
    kind: typeface
    source: Google/monotype Noto project
    licence: SIL Open Font License 1.1 — permits print embedding with licence text retained
    status: cleared for embedding; OFL text to be included in shipping bundle
  - path: font: DejaVu Sans Mono (system-installed)
    kind: typeface
    source: DejaVu fonts project
    licence: Bitstream Vera / DejaVu licence (permissive, embedding allowed)
    status: cleared for embedding
  - path: photographic key image (cover / openers)
    kind: photo
    source: NOT SOURCED YET
    licence: none — deliberately omitted
    status: "BLOCKER — candidates: NASA Image & Video Library (usage terms vary; some products restricted), NASA SVS, ESA, ESO. Each candidate needs individual licence review incl. commercial print rights before download. Interim: original vector illustration used."

policy:
  - No image has been downloaded or embedded without registration.
  - Credit lines are recorded but treated as attribution, not permission.
  - Any future asset must be appended here BEFORE embedding.
